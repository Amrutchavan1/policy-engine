version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: policy_postgres
    environment:
      POSTGRES_USER: policy_user
      POSTGRES_PASSWORD: policy_password
      POSTGRES_DB: policy_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: policy_redis
    ports:
      - "6379:6379"